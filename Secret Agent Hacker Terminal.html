<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secret Agent Hacker Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#03060a; --panel:rgba(8,16,22,.72); --line:rgba(0,255,136,.25);
  --green:#00ff88; --cyan:#00e5ff; --pink:#ff2bd6; --amber:#ffd400; --red:#ff3b5c;
  --text:#c9ffe6; --dim:#5f8f7b;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:14px}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.55}
.scan{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
header{position:relative;z-index:2;text-align:center;padding:22px 16px 6px}
header h1{margin:0;font:800 clamp(18px,4vw,30px)/1.2 'Orbitron',sans-serif;letter-spacing:.06em;color:var(--green);text-shadow:0 0 12px var(--green),0 0 34px rgba(0,255,136,.5);cursor:pointer;user-select:none}
header p{margin:8px 0 0;font-size:13px;color:var(--cyan);text-shadow:0 0 10px rgba(0,229,255,.6)}
.top{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}
main{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:14px 16px 40px;display:grid;gap:16px;grid-template-columns:1.1fr .9fr}
@media(max-width:820px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(10px);box-shadow:0 0 30px rgba(0,255,136,.07),inset 0 0 30px rgba(0,255,136,.03)}
.panel h2{margin:0 0 12px;font:600 13px 'Orbitron',sans-serif;color:var(--cyan);letter-spacing:.08em}
.btn{font:600 13px 'JetBrains Mono',monospace;color:var(--green);background:rgba(0,255,136,.07);border:1px solid var(--green);border-radius:10px;padding:10px 14px;cursor:pointer;transition:transform .12s,box-shadow .2s,background .2s;position:relative;overflow:hidden}
.btn:hover{background:rgba(0,255,136,.16);box-shadow:0 0 18px rgba(0,255,136,.45)}
.btn:active{transform:scale(.94)}
.btn:focus-visible,input:focus-visible,#glyph:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:wait}
.btn.pink{color:var(--pink);border-color:var(--pink);background:rgba(255,43,214,.07)}
.btn.pink:hover{background:rgba(255,43,214,.16);box-shadow:0 0 18px rgba(255,43,214,.5)}
.btn.cyan{color:var(--cyan);border-color:var(--cyan);background:rgba(0,229,255,.07)}
.btn.cyan:hover{background:rgba(0,229,255,.16);box-shadow:0 0 18px rgba(0,229,255,.5)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.tools{display:grid;gap:12px}
.tool{border:1px solid rgba(0,255,136,.15);border-radius:12px;padding:12px;display:grid;gap:10px}
.tool .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tool b{color:var(--text);font-weight:600}.tool small{color:var(--dim);display:block;margin-top:2px}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--cyan));box-shadow:0 0 14px var(--green);transition:width .15s linear}
.bar.done>i{background:linear-gradient(90deg,var(--cyan),var(--pink))}
.pct{font-size:12px;color:var(--green);min-width:38px;text-align:right}
#term{height:300px;overflow-y:auto;background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:12px;padding:12px;line-height:1.55;font-size:13px}
#term div{white-space:pre-wrap;word-break:break-word;animation:in .2s ease-out}
@keyframes in{from{opacity:0;transform:translateX(-6px)}}
.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.inf{color:var(--cyan)}.dim{color:var(--dim)}
.prompt{display:flex;gap:8px;margin-top:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:rgba(0,0,0,.4)}
.prompt span{color:var(--green)}
input{flex:1;background:transparent;border:0;color:var(--text);font:inherit;padding:11px 0;outline-offset:6px}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;color:var(--dim);font-size:12px}
.stats b{color:var(--amber)}
#game{display:none;grid-column:1/-1;border-color:var(--pink);box-shadow:0 0 40px rgba(255,43,214,.18)}
#game.show{display:block;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(14px)}}
#game h2{color:var(--pink)}
.cipher{font:800 clamp(22px,5vw,38px) 'Orbitron',sans-serif;letter-spacing:.2em;text-align:center;color:var(--pink);text-shadow:0 0 18px rgba(255,43,214,.7);padding:18px 8px;word-break:break-all}
.dec{font:600 clamp(18px,4vw,28px) 'JetBrains Mono',monospace;letter-spacing:.2em;text-align:center;color:var(--green);text-shadow:0 0 12px rgba(0,255,136,.6);min-height:1.5em;word-break:break-all}
.gctl{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin:16px 0}
input[type=range]{accent-color:var(--pink);width:min(320px,70vw);flex:none;padding:0}
.guess{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.guess input{flex:0 1 260px;border:1px solid var(--pink);border-radius:10px;padding:10px 12px;text-transform:uppercase;background:rgba(0,0,0,.4)}
.msg{text-align:center;min-height:1.6em;margin-top:12px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
footer{position:relative;z-index:2;text-align:center;padding:0 0 24px;color:var(--dim);font-size:12px}
#glyph{background:none;border:0;color:rgba(0,255,136,.18);font-size:16px;cursor:pointer;transition:color .3s,transform .2s}
#glyph:hover{color:var(--pink);transform:rotate(90deg) scale(1.3)}
.flash{animation:flash .5s}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--green)}100%{box-shadow:0 0 0 22px transparent}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="scan"></div>

<header>
  <h1 id="title">Created by Student 150096725089</h1>
  <p>Secret Agent Hacker Terminal &amp; Mini-Game</p>
  <div class="top">
    <button class="btn cyan" id="snd">Sound: on</button>
    <button class="btn pink" id="clr">Clear terminal</button>
  </div>
</header>

<main>
  <section class="panel">
    <h2>Hack tools</h2>
    <div class="tools" id="tools"></div>
    <div class="stats">Targets breached: <b id="cnt">0/4</b> Access level: <b id="lvl">GUEST</b></div>
  </section>

  <section class="panel">
    <h2>Terminal</h2>
    <div id="term" role="log" aria-live="polite"></div>
    <div class="prompt"><span>agent@ghost:~$</span><input id="cmd" autocomplete="off" spellcheck="false" aria-label="Terminal command" placeholder="type help"></div>
  </section>

  <section class="panel" id="game">
    <h2>Cipher vault: decode the message</h2>
    <div class="dec" id="plain" aria-live="polite"></div>
    <div class="cipher" id="enc"></div>
    <div class="gctl">
      <label for="shift" class="dim">Decoder shift: <b id="sv" class="ok">0</b></label>
      <input type="range" id="shift" min="0" max="25" value="0">
      <button class="btn cyan" id="hint">Hint (−50 pts)</button>
    </div>
    <div class="guess">
      <input id="ans" placeholder="Enter decoded word" autocomplete="off" aria-label="Decoded word">
      <button class="btn pink" id="sub">Submit</button>
    </div>
    <div class="msg" id="gmsg"></div>
    <div class="stats" style="justify-content:center">Level: <b id="gl">1/5</b> Score: <b id="gs">0</b></div>
  </section>
</main>

<footer>Some glyphs are not just decoration. <button id="glyph" aria-label="Hidden glyph">◈</button></footer>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const term=$('#term'), cmd=$('#cmd');

/* ---------- Matrix rain ---------- */
const cv=$('#rain'), cx=cv.getContext('2d');
let cols, drops, fs=16;
const chars='アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEF<>/\\{}$#';
function size(){cv.width=innerWidth;cv.height=innerHeight;cols=Math.ceil(cv.width/fs);drops=Array.from({length:cols},()=>Math.random()*-50)}
addEventListener('resize',size);size();
function rain(){
  cx.fillStyle='rgba(3,6,10,.08)';cx.fillRect(0,0,cv.width,cv.height);
  cx.font=fs+'px monospace';
  for(let i=0;i<cols;i++){
    const c=chars[Math.floor(Math.random()*chars.length)];
    cx.fillStyle=Math.random()>.975?'#ffffff':'#00ff88';
    cx.fillText(c,i*fs,drops[i]*fs);
    if(drops[i]*fs>cv.height&&Math.random()>.975)drops[i]=0;
    drops[i]+=.6;
  }
}
setInterval(rain,45);

/* ---------- Sound ---------- */
let actx=null, soundOn=true;
function tone(f,d,type,vol,slide){
  if(!soundOn)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'square';o.frequency.value=f;
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,actx.currentTime+d);
    g.gain.value=vol||.04;g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);
    o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);
  }catch(e){}
}
const sfx={
  click:()=>tone(660,.08,'square',.04),
  tick:()=>tone(1200+Math.random()*400,.03,'square',.02),
  ok:()=>{tone(523,.12,'triangle',.06);setTimeout(()=>tone(784,.2,'triangle',.06),110)},
  bad:()=>tone(160,.3,'sawtooth',.06,60),
  win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.18,'triangle',.07),i*110)),
  unlock:()=>tone(200,.6,'sine',.08,1400)
};
$('#snd').onclick=e=>{soundOn=!soundOn;e.target.textContent='Sound: '+(soundOn?'on':'off');sfx.click()};

/* ---------- Ripple on every button ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('.btn');if(!b)return;
  const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)/4,d=document.createElement('span');
  d.className='ripple';d.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;
  b.appendChild(d);setTimeout(()=>d.remove(),600);
  if(b.id!=='snd')sfx.click();
});

/* ---------- Terminal ---------- */
function log(t,c){const d=document.createElement('div');if(c)d.className=c;d.textContent=t;term.appendChild(d);term.scrollTop=term.scrollHeight}
async function typeLines(lines,c){for(const l of lines){log(l,c);sfx.tick();await wait(120)}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
$('#clr').onclick=()=>{term.innerHTML='';log('Terminal cleared.','dim')};

/* ---------- Hack tools ---------- */
const hackers=[
  {id:'scan',name:'Port scanner',desc:'Probe 10.13.37.7 for open ports',btn:'Scan',lines:['Resolving host 10.13.37.7…','Port 22 (ssh): OPEN','Port 80 (http): FILTERED','Port 443 (https): OPEN','Port 31337 (elite): OPEN','Scan complete. 3 open ports.']},
  {id:'crack',name:'Password cracker',desc:'Brute-force the admin hash',btn:'Crack',lines:['Loading wordlist: 14,344,392 entries','Hash: 5f4dcc3b5aa765d6…','Trying: letmein … no','Trying: hunter2 … no','Match found: ********','Admin credentials recovered.']},
  {id:'fire',name:'Firewall breach',desc:'Slip past the perimeter defenses',btn:'Breach',lines:['Injecting packet fragments…','Spoofing MAC address','Rule 14 bypassed','Rule 27 bypassed','Intrusion detection: BLINDED','Firewall breached.']},
  {id:'sat',name:'Satellite uplink',desc:'Decrypt the orbital relay feed',btn:'Uplink',lines:['Aligning dish: azimuth 142.7°','Handshake with SAT-GHOST-9','Negotiating AES-256 key','Stream decrypted','Feed: “The eagle flies at midnight.”','Uplink secured.']}
];
const done=new Set();
const tools=$('#tools');
hackers.forEach(h=>{
  const el=document.createElement('div');el.className='tool';
  el.innerHTML=`<div class="row"><div><b>${h.name}</b><small>${h.desc}</small></div><button class="btn" data-id="${h.id}">${h.btn}</button></div>
  <div class="row"><div class="bar" style="flex:1"><i></i></div><span class="pct">0%</span></div>`;
  tools.appendChild(el);h.el=el;
  el.querySelector('button').onclick=()=>run(h);
});
async function run(h){
  const b=h.el.querySelector('button'),bar=h.el.querySelector('.bar'),fill=bar.firstElementChild,pct=h.el.querySelector('.pct');
  if(b.disabled)return;
  b.disabled=true;bar.classList.remove('done');fill.style.width='0';
  log('> '+h.name+' started','inf');
  const steps=h.lines.length;let p=0;
  for(let i=0;i<steps;i++){
    const target=Math.round((i+1)/steps*100);
    while(p<target){p+=2;fill.style.width=p+'%';pct.textContent=p+'%';if(p%10===0)sfx.tick();await wait(25+Math.random()*25)}
    log('  '+h.lines[i],i===steps-1?'ok':'');
  }
  bar.classList.add('done');sfx.ok();h.el.classList.add('flash');setTimeout(()=>h.el.classList.remove('flash'),500);
  b.disabled=false;b.textContent='Rerun';
  done.add(h.id);update();
}
function update(){
  $('#cnt').textContent=done.size+'/4';
  const lv=['GUEST','OPERATOR','AGENT','SHADOW','GHOST'][done.size];
  $('#lvl').textContent=lv;
  if(done.size===4&&!unlocked)log('ALL TARGETS BREACHED. A hidden ◈ glyph is pulsing in the footer… or try the command “cipher”.','warn');
}

/* ---------- Commands ---------- */
const hist=[];let hi=0;
const cmds={
  help:()=>typeLines(['Commands:','  help      show this list','  scan      run port scanner','  crack     run password cracker','  breach    run firewall breach','  uplink    run satellite uplink','  whoami    identify yourself','  matrix    toggle rain intensity','  clear     clear the terminal','  cipher    ???'],'inf'),
  whoami:()=>log('agent_150096725089 // clearance: '+$('#lvl').textContent,'ok'),
  clear:()=>{term.innerHTML=''},
  scan:()=>run(hackers[0]),crack:()=>run(hackers[1]),breach:()=>run(hackers[2]),uplink:()=>run(hackers[3]),
  matrix:()=>{cv.style.opacity=cv.style.opacity==='1'?'.55':'1';log('Rain intensity adjusted.','dim')},
  cipher:()=>unlock(),
  sudo:()=>{log('Nice try, agent. Permission denied.','bad');sfx.bad()}
};
cmd.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const v=cmd.value.trim().toLowerCase();cmd.value='';if(!v)return;
    hist.push(v);hi=hist.length;log('agent@ghost:~$ '+v,'dim');sfx.click();
    (cmds[v]||(()=>{log('Unknown command: '+v+'. Type help.','bad');sfx.bad()}))();
  }else if(e.key==='ArrowUp'&&hi>0){cmd.value=hist[--hi];e.preventDefault()}
  else if(e.key==='ArrowDown'){cmd.value=hist[++hi]||'';}
});

/* ---------- Hidden cipher game ---------- */
const words=['AGENT','SHADOW','PHANTOM','FIREWALL','MIDNIGHT'];
let unlocked=false,lvl=0,score=0,key=0,hinted=false,tries=0;
const enc=(w,k)=>[...w].map(c=>String.fromCharCode((c.charCodeAt(0)-65+k)%26+65)).join('');
const dec=(w,k)=>enc(w,26-k);
function unlock(){
  if(unlocked){$('#game').scrollIntoView({behavior:'smooth'});return}
  unlocked=true;sfx.unlock();
  log('◈ CIPHER VAULT UNLOCKED ◈','warn');
  $('#game').classList.add('show');load();
  setTimeout(()=>$('#game').scrollIntoView({behavior:'smooth'}),100);
}
function load(){
  key=1+Math.floor(Math.random()*25);hinted=false;tries=0;
  $('#enc').textContent=enc(words[lvl],key);
  $('#shift').value=0;$('#sv').textContent='0';$('#plain').textContent=enc(words[lvl],key);
  $('#gl').textContent=(lvl+1)+'/5';$('#gs').textContent=score;
  $('#gmsg').textContent='Slide the decoder until the letters make sense.';$('#gmsg').className='msg dim';
  $('#ans').value='';
}
$('#shift').oninput=e=>{
  const s=+e.target.value;$('#sv').textContent=s;sfx.tick();
  $('#plain').textContent=dec(enc(words[lvl],key),s);
};
$('#hint').onclick=()=>{
  if(hinted)return;hinted=true;score=Math.max(0,score-50);$('#gs').textContent=score;
  $('#gmsg').textContent='Hint: this is a Caesar cipher shifted by '+key+'.';$('#gmsg').className='msg warn';
};
function submit(){
  const g=$('#ans').value.trim().toUpperCase(),m=$('#gmsg');
  if(g===words[lvl]){
    score+=Math.max(50,200-tries*40);sfx.ok();m.textContent='Correct! '+words[lvl]+' decrypted.';m.className='msg ok';
    lvl++;
    if(lvl>=words.length){sfx.win();m.textContent='VAULT CRACKED. Final score '+score+'. You are a true Ghost.';m.className='msg ok';
      log('Cipher vault cracked. Score: '+score,'ok');$('#gs').textContent=score;lvl=0;setTimeout(()=>{score=0;load();m.textContent='Replay: new shifts generated.'},4000);return}
    $('#gs').textContent=score;setTimeout(load,900);
  }else{
    tries++;sfx.bad();m.textContent='Access denied. Try again.';m.className='msg bad';
    const gc=$('.guess');gc.classList.remove('shake');void gc.offsetWidth;gc.classList.add('shake');
  }
}
$('#sub').onclick=submit;
$('#ans').addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
$('#glyph').onclick=()=>{sfx.click();unlock()};
let tc=0;$('#title').onclick=()=>{if(++tc>=5){tc=0;unlock()}};

/* ---------- Boot ---------- */
(async()=>{
  await typeLines(['Booting GHOST-OS v7.3…','Loading modules… done','Encrypted tunnel: ACTIVE','Welcome, agent. Type “help” to begin.'],'ok');
})();
})();
</script>
</body>
</html>
